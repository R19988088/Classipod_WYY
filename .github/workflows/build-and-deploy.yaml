name: Android Release APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  android:
    name: Signed arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies and verify
        run: |
          flutter pub get --suppress-analytics
          flutter gen-l10n
          dart run build_runner build --delete-conflicting-outputs
          flutter analyze --suppress-analytics
          flutter test --no-pub --suppress-analytics

      - name: Restore fixed signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/key.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../key.jks
          EOF

      - name: Build minimal release APK
        run: |
          flutter build apk \
            --release \
            --flavor production \
            --target-platform android-arm64 \
            --split-per-abi \
            --obfuscate \
            --split-debug-info=/tmp/classipod-symbols \
            --tree-shake-icons \
            --no-pub \
            --suppress-analytics
          mv build/app/outputs/flutter-apk/app-arm64-v8a-production-release.apk Classipod-WYY.apk

      - name: Verify package and fixed certificate
        run: |
          test -s Classipod-WYY.apk
          keytool -printcert -jarfile Classipod-WYY.apk
          sha256sum Classipod-WYY.apk

      - name: Publish direct APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view continuous >/dev/null 2>&1; then
            gh release edit continuous --title "Classipod WYY Continuous" --prerelease
          else
            gh release create continuous --title "Classipod WYY Continuous" --prerelease
          fi
          gh release upload continuous Classipod-WYY.apk --clobber
